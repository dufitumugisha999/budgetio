<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Budgetio · U Rwanda · RWF</title>
    <!-- Poppins & icons (minimal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Rwanda flag inspiration: deep blue sky, sun yellow, green earth */
            background: linear-gradient(145deg, #f0f4f0 0%, #e0eadf 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        /* ultra compact card – rwanda tricolor accents */
        .phone-frame {
            width: 100%;
            max-width: 340px;
            background: #fefef7;
            border-radius: 42px;
            box-shadow: 0 20px 35px -12px #1f3b2c60;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* rwanda flag edge: subtle border homage */
            border: 1px solid #f9d849;
            position: relative;
        }
        /* subtle flag bar at top (yellow sun + green/blue) */
        .phone-frame::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #006aa7 0%, #f9d849 40%, #206c46 70%, #e5b33c 100%);
            border-radius: 42px 42px 0 0;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            display: flex;
            align-items: baseline;
            gap: 6px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #006aa7, #206c46);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }
        h1 i { 
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #f9c23c;
            font-size: 1.8rem;
            text-shadow: 0 0 1px #d48d1a;
        }
        .currency-badge {
            font-size: 0.7rem;
            background: #eef3e8;
            padding: 2px 8px;
            border-radius: 50px;
            font-weight: 500;
            color: #1f543d;
            margin-left: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* choice buttons (Rwandan yellow/sun) */
        .choice-row {
            display: flex;
            gap: 10px;
            margin: 4px 0 2px;
        }
        .choice-btn {
            background: #fef1c7;
            border-radius: 60px;
            padding: 14px 0;
            font-weight: 600;
            font-size: 1.2rem;
            color: #1a442f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            box-shadow: 0 4px 10px -4px #b4cfb0;
            cursor: pointer;
            border: none;
            transition: all 0.1s ease;
        }
        .choice-btn i { font-size: 1.2rem; color: #e68a2e; }
        .choice-btn:active { transform: scale(0.97); background: #fae48c; }

        /* question panel: fresh green + blue elements */
        .question-panel {
            background: #eaf7ec;
            border-radius: 40px;
            padding: 18px 14px;
            box-shadow: inset 0 1px 3px #c2ddbc, 0 6px 12px -8px #9eb894;
        }
        .field-label {
            font-size: 1rem;
            font-weight: 500;
            color: #1e4a35;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .field-label i { font-size: 1.3rem; color: #f7b32b; }

        .skip-row {
            display: flex;
            gap: 8px;
            margin: 8px 0;
        }
        .inp-skip {
            flex: 1;
            background: white;
            border: 1px solid #cbe5cd;
            border-radius: 40px;
            padding: 12px 14px;
            font-size: 0.9rem;
            box-shadow: 0 2px 6px #d0e2cf;
            color: #1f3b2c;
        }
        .inp-skip:focus { outline: 2px solid #fbcc5e; border-color: #e09d2c; }

        .action-btn {
            background: #ffe3aa;
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px #c0dbb4;
            cursor: pointer;
            color: #1f543d;
        }
        .small-hint {
            font-size: 0.7rem;
            color: #558b2f;
            margin-top: 6px;
            text-align: right;
        }

        /* result panel – Rwandan sun & savanna */
        .result-panel {
            background: #fef9e6;
            border-radius: 40px;
            padding: 18px 12px;
            border-left: 4px solid #f9d849;
            border-right: 2px solid #e0ecdb;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .metric-cell {
            background: #fefdf7;
            border-radius: 32px;
            padding: 10px 4px;
            text-align: center;
            box-shadow: 0 3px 8px #dfe9db;
            border-bottom: 2px solid #cee0c2;
        }
        .metric-cell i { font-size: 1.2rem; color: #f5a623; }
        .metric-cell .value { font-size: 1.3rem; font-weight: 700; color: #1f543d; letter-spacing: -0.3px; }
        .ai-suggest {
            background: #e1f0df;
            border-radius: 30px;
            padding: 14px;
            font-size: 0.8rem;
            margin: 12px 0 6px;
            color: #1a442f;
            border-left: 3px solid #f7c24c;
        }
        .back-home {
            background: #ffe0a3;
            border-radius: 40px;
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            color: #2b5e3b;
        }

        /* past list rwandan vibe */
        .past-list {
            background: #edf7ea;
            border-radius: 36px;
            padding: 14px 10px;
            max-height: 280px;
            overflow-y: auto;
        }
        .history-item {
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 50px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            box-shadow: 0 2px 5px #c5dfbf;
            border-right: 3px solid #f9d849;
        }
        .delete-past {
            background: none;
            border: none;
            color: #bd8a3a;
            font-size: 1rem;
        }
        .clear-small {
            background: #f7e5bf;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.8rem;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #3a6b47;
        }

        .hidden { display: none; }
        .rwf-symbol {
            font-weight: 500;
            background: #fef1cf;
            border-radius: 20px;
            padding: 0px 6px;
            font-size: 0.7rem;
            margin-left: 4px;
        }
    </style>
</head>
<body>
<div class="phone-frame" id="app">
    <h1><i class="fas fa-sun"></i> budgetio <span class="currency-badge"><i class="fas fa-coins"></i> RWF</span></h1>

    <!-- HOME (new / past) -->
    <div id="homeView">
        <div class="choice-row">
            <div class="choice-btn" id="newBtn"><i class="fas fa-plus-circle"></i> NEW</div>
            <div class="choice-btn" id="pastBtn"><i class="fas fa-history"></i> PAST</div>
        </div>
        <div style="font-size:0.7rem; text-align:center; color:#5f8b4f;">🇷🇼 Rwanda · igitondo cyiza</div>
    </div>

    <!-- QUESTION FLOW (one by one) -->
    <div id="questionView" class="hidden">
        <div class="question-panel">
            <div class="field-label" id="questionIcon"><i class="fas fa-wallet"></i> <span id="questionText">Income?</span></div>
            <div class="skip-row">
                <input type="number" id="stepInput" class="inp-skip" placeholder="0 or skip (RWF)">
                <button class="action-btn" id="nextBtn"><i class="fas fa-arrow-right"></i></button>
            </div>
            <div style="display: flex; gap:6px; justify-content: space-between;">
                <button class="action-btn" id="skipBtn" style="padding:8px 12px;"><i class="fas fa-forward"></i> skip</button>
                <button class="action-btn" id="finishEarlyBtn" style="padding:8px 12px;"><i class="fas fa-chart-simple"></i> done</button>
            </div>
            <div class="small-hint" id="stepCounter">1/6 · RWF</div>
        </div>
    </div>

    <!-- RESULT VIEW -->
    <div id="resultView" class="hidden">
        <div class="result-panel">
            <div style="font-weight:600; margin-bottom:4px; display:flex; gap:6px; align-items:center;"><i class="fas fa-flag-checkered" style="color:#e6a017;"></i> <span>amakuru y’imari</span> <span style="font-size:0.65rem; background:#fff0cc; border-radius:30px; padding:2px 8px;">RWF</span></div>
            <div class="metric-grid" id="resultMetrics"></div>
            <div class="ai-suggest" id="resultAi">✨ ubwenge bw'imari</div>
            <div style="display:flex; gap:6px; margin:10px 0;">
                <button class="action-btn" id="saveResultBtn" style="flex:1;"><i class="fas fa-save"></i> bikore</button>
                <button class="action-btn" id="newFromResult" style="flex:1;"><i class="fas fa-plus"></i> shya</button>
            </div>
            <div class="back-home" id="backHomeFromResult"><i class="fas fa-home"></i> urugendo</div>
        </div>
    </div>

    <!-- PAST VIEW -->
    <div id="pastView" class="hidden">
        <div class="past-list" id="pastContainer"></div>
        <div style="display:flex; gap:10px; margin-top:12px;">
            <button class="clear-small" id="clearAllPast"><i class="fas fa-trash-alt"></i> hanura byose</button>
            <button class="clear-small" id="backFromPast"><i class="fas fa-arrow-left"></i> inyuma</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- RWANDAN FRANCS (RWF) ----------
        const CURRENCY_SYMBOL = "RWF";
        const CURRENCY_PREFIX = "";   // we show "RWF" after number or before? e.g. 1250 RWF
        function formatRWF(value) {
            // format with no decimals for readability, but keep integer
            let num = Math.round(value || 0);
            return num.toLocaleString('en-RW') + " " + CURRENCY_SYMBOL;
        }

        let history = JSON.parse(localStorage.getItem('budgetio_rwf_history')) || [];

        // steps (labels same but now currency RWF)
        const steps = [
            { label: 'Income? (RWF)', icon: 'fa-wallet', key: 'income' },
            { label: 'Investment? (RWF)', icon: 'fa-chart-line', key: 'investment' },
            { label: 'Bills? (RWF)', icon: 'fa-file-invoice', key: 'bills' },
            { label: 'Tax? (RWF)', icon: 'fa-percent', key: 'tax' },
            { label: 'Other exp? (RWF)', icon: 'fa-receipt', key: 'other' },
            { label: 'Extra earn? (RWF)', icon: 'fa-hand-holding-usd', key: 'earnings' }
        ];

        let currentData = {
            income: null, investment: null, bills: null, tax: null, other: null, earnings: null
        };
        let currentStep = 0;

        const home = document.getElementById('homeView');
        const question = document.getElementById('questionView');
        const result = document.getElementById('resultView');
        const past = document.getElementById('pastView');

        const questionText = document.getElementById('questionText');
        const questionIconElem = document.querySelector('#questionIcon i');
        const stepInput = document.getElementById('stepInput');
        const nextBtn = document.getElementById('nextBtn');
        const skipBtn = document.getElementById('skipBtn');
        const finishEarly = document.getElementById('finishEarlyBtn');
        const stepCounter = document.getElementById('stepCounter');

        const resultMetrics = document.getElementById('resultMetrics');
        const resultAi = document.getElementById('resultAi');
        const saveResultBtn = document.getElementById('saveResultBtn');
        const newFromResult = document.getElementById('newFromResult');
        const backHomeFromResult = document.getElementById('backHomeFromResult');

        const pastContainer = document.getElementById('pastContainer');
        const clearAllPast = document.getElementById('clearAllPast');
        const backFromPast = document.getElementById('backFromPast');

        document.getElementById('newBtn').addEventListener('click', startNew);
        document.getElementById('pastBtn').addEventListener('click', showPast);

        function hideAll() {
            home.classList.add('hidden');
            question.classList.add('hidden');
            result.classList.add('hidden');
            past.classList.add('hidden');
        }

        function startNew() {
            currentData = { income: null, investment: null, bills: null, tax: null, other: null, earnings: null };
            currentStep = 0;
            hideAll();
            question.classList.remove('hidden');
            updateStep();
        }

        function updateStep() {
            if (currentStep >= steps.length) {
                computeResult();
                return;
            }
            const s = steps[currentStep];
            questionText.innerText = s.label;
            if (questionIconElem) questionIconElem.className = `fas ${s.icon}`;
            stepInput.value = '';
            stepInput.placeholder = `enter RWF or skip`;
            stepCounter.innerText = `${currentStep+1}/${steps.length} · RWF`;
        }

        function handleNext() {
            if (currentStep >= steps.length) return;
            const key = steps[currentStep].key;
            const val = stepInput.value.trim();
            if (val !== '') {
                const num = parseFloat(val);
                if (!isNaN(num) && num >= 0) currentData[key] = num;
                else currentData[key] = null;
            } else {
                currentData[key] = null;
            }
            currentStep++;
            if (currentStep < steps.length) updateStep();
            else computeResult();
        }

        function handleSkip() {
            if (currentStep >= steps.length) return;
            const key = steps[currentStep].key;
            currentData[key] = null;
            currentStep++;
            if (currentStep < steps.length) updateStep();
            else computeResult();
        }

        nextBtn.addEventListener('click', (e) => { e.preventDefault(); handleNext(); });
        skipBtn.addEventListener('click', (e) => { e.preventDefault(); handleSkip(); });
        finishEarly.addEventListener('click', (e) => { e.preventDefault(); computeResult(); });

        // metrics computation with RWF values
        function getMetrics() {
            const inc = currentData.income || 0;
            const inv = currentData.investment || 0;
            const bills = currentData.bills || 0;
            const tax = currentData.tax || 0;
            const other = currentData.other || 0;
            const extra = currentData.earnings || 0;

            const totalIncome = inc + extra;
            const totalExp = bills + tax + other;
            const net = totalIncome - totalExp;
            const savings = net - inv;        // net after investment? Actually classic: savings = net - investment? fine.
            const sRate = totalIncome > 0 ? (savings / totalIncome) * 100 : 0;
            const liq = totalIncome > 0 ? (net / totalIncome) * 100 : 0;
            const invRatio = totalIncome > 0 ? (inv / totalIncome) * 100 : 0;

            return {
                totalIncome, net, savings,
                sRate: Math.round(sRate * 10) / 10,
                liq: Math.round(liq * 10) / 10,
                invRatio: Math.round(invRatio * 10) / 10,
                inv, bills, tax, other, inc, extra
            };
        }

        // Rwandan flavour AI tips (based on RWF & local context)
        function shortAI(m) {
            if (m.totalIncome === 0) return "🇷🇼 Injiza amafaranga yinjira kugira ngo ubone ibyifuzo (enter income)";
            if (m.sRate < 0) return "⚠️ amafaranga asohoka arenze ayinjira — gerageza kugabanya ibyo utunga (expenses exceed)";
            if (m.sRate < 10) return "💡 ubwishingizi burenzeho bugera ku 10% gusa · gerageza kubika 5% mu 'bindi'";
            if (m.invRatio < 5 && m.totalIncome > 0) return "🌱 ishorisho riri munsi ya 5% · shora buhoro buhoro mu bikorwa by'ubukungu (invest slowly)";
            if (m.sRate > 25) return "🎉 urimo ubikira neza! Ushobora kongera ishorisho mu Rwanda";
            return "✅ ihuriro ryiza · komeza ukurikirane imari yawe";
        }

        function computeResult() {
            hideAll();
            result.classList.remove('hidden');
            const m = getMetrics();
            // format with RWF for net value
            resultMetrics.innerHTML = `
                <div class="metric-cell"><i class="fas fa-coins"></i><div class="value">${formatRWF(m.net)}</div><div style="font-size:0.6rem;">net (inyungu)</div></div>
                <div class="metric-cell"><i class="fas fa-piggy-bank"></i><div class="value">${m.sRate}%</div><div style="font-size:0.6rem;">ubwishingizi rate</div></div>
                <div class="metric-cell"><i class="fas fa-shield-alt"></i><div class="value">${m.liq}%</div><div style="font-size:0.6rem;">liquid rate</div></div>
                <div class="metric-cell"><i class="fas fa-chart-pie"></i><div class="value">${m.invRatio}%</div><div style="font-size:0.6rem;">ishorisho %</div></div>
            `;
            // show income info in AI additional context
            let incomeStr = formatRWF(m.totalIncome);
            resultAi.innerHTML = `✨ ${shortAI(m)}<br><span style="font-size:0.7rem; display:inline-block; margin-top:6px;">💰 Amafaranga yose yinjira: ${incomeStr} | Ikiguzi cyose: ${formatRWF(m.net)}</span>`;
        }

        // save current entry to localStorage with RWF data
        function saveCurrent() {
            const m = getMetrics();
            const date = new Date();
            const dateStr = `${date.toLocaleDateString('rw', {year:'numeric', month:'short', day:'numeric'})} ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
            const entry = {
                date: dateStr,
                income: currentData.income,
                investment: currentData.investment,
                bills: currentData.bills,
                tax: currentData.tax,
                other: currentData.other,
                earnings: currentData.earnings,
                sRate: m.sRate,
                net: m.net,
                totalIncome: m.totalIncome
            };
            history.unshift(entry);
            if (history.length > 20) history.pop();
            localStorage.setItem('budgetio_rwf_history', JSON.stringify(history));
            alert('✓ Ibyo wabikuye bibikijwe! (saved in RWF)');
        }

        saveResultBtn.addEventListener('click', saveCurrent);
        newFromResult.addEventListener('click', startNew);
        backHomeFromResult.addEventListener('click', () => {
            hideAll();
            home.classList.remove('hidden');
        });

        // ----- PAST VIEW with RWF formatting & Rwanda colors -----
        function renderPast() {
            if (history.length === 0) {
                pastContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#5f7343;"><i class="fas fa-folder-open"></i> nta mateka yabonetse</div>';
                return;
            }
            let html = '';
            history.forEach((item, idx) => {
                const netFormatted = (item.net !== undefined && item.net !== null) ? formatRWF(item.net) : '0 RWF';
                const rate = item.sRate ?? 0;
                html += `<div class="history-item" data-past-idx="${idx}">
                    <span><i class="far fa-calendar-alt" style="color:#e6a017;"></i> ${item.date || ''}</span>
                    <span style="font-weight:700; background:#f9edc7; padding:2px 10px; border-radius:40px;">${rate}%</span>
                    <span style="font-size:0.7rem; color:#4a7640;">${netFormatted}</span>
                    <button class="delete-past" data-del="${idx}"><i class="fas fa-trash-alt"></i></button>
                </div>`;
            });
            pastContainer.innerHTML = html;

            // load selected past entry into current data and show result
            document.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-past')) return;
                    const idx = el.getAttribute('data-past-idx');
                    if (idx && history[parseInt(idx)]) {
                        const entry = history[parseInt(idx)];
                        currentData = {
                            income: entry.income ?? null,
                            investment: entry.investment ?? null,
                            bills: entry.bills ?? null,
                            tax: entry.tax ?? null,
                            other: entry.other ?? null,
                            earnings: entry.earnings ?? null
                        };
                        computeResult();
                    }
                });
            });

            document.querySelectorAll('.delete-past').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = btn.getAttribute('data-del');
                    if (idx !== null) {
                        history.splice(parseInt(idx), 1);
                        localStorage.setItem('budgetio_rwf_history', JSON.stringify(history));
                        renderPast();
                    }
                });
            });
        }

        function showPast() {
            hideAll();
            past.classList.remove('hidden');
            renderPast();
        }

        clearAllPast.addEventListener('click', () => {
            if (confirm('Ukurikije amateka yose? (Delete all history)?')) {
                history = [];
                localStorage.removeItem('budgetio_rwf_history');
                renderPast();
            }
        });

        backFromPast.addEventListener('click', () => {
            hideAll();
            home.classList.remove('hidden');
        });

        stepInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleNext();
            }
        });

        // additional rwandan touch: step placeholder (RWF)
        hideAll();
        home.classList.remove('hidden');
    })();
</script>
</body>
</html>
